name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run regression tests with the image's Python version
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace python:3.11-alpine \
            sh -c 'pip install -r requirements.txt && python -m unittest discover -s tests -v'
